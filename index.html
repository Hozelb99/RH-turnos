<style>
:root { --bg: #f2f4f8; --fg: #131823; --muted: #566175; --card: #fff; --line: #d9dfea; --acc: #1d4ed8; --err: #b42318; }
@media (prefers-color-scheme: dark) { :root { --bg: #0e1218; --fg: #e9edf4; --muted: #9ba7ba; --card: #171d27; --line: #2b3546; --acc: #7aa2ff; --err: #ff8f85; } }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Arial, sans-serif; }
main { min-height: 100vh; display: grid; place-items: center; padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); }
form { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px 20px; display: flex; flex-direction: column; gap: 14px; }
h1 { margin: 0; font-size: 22px; } p { margin: 0; color: var(--muted); font-size: 14px; }
input[type=password], input[type=text] { width: 100%; font: inherit; font-size: 17px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
label.chk { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--muted); }
button { font: inherit; font-weight: 700; padding: 13px; border: 0; border-radius: 12px; background: var(--acc); color: #fff; }
@media (prefers-color-scheme: dark) { button { color: #0b1220; } }
button[disabled] { opacity: .6; }
#msg { color: var(--err); min-height: 20px; font-size: 14px; }
</style>
</head>
<body>
<main>
<form id="f" autocomplete="on">
<h1>RH Turno Pro</h1>
<p>Acceso protegido. Escribe la contraseña para abrir la aplicación.</p>
<input type="text" name="username" value="rh-turno-pro" autocomplete="username" hidden>
<input type="password" id="pw" name="password" autocomplete="current-password" placeholder="Contraseña" aria-label="Contraseña" autofocus>
<label class="chk"><input type="checkbox" id="rem"> Mantener desbloqueado en este dispositivo (usa solo tu equipo personal)</label>
<button id="go" type="submit">Entrar</button>
<div id="msg" role="alert"></div>
<p>Tus datos se guardan solo en este dispositivo. Esta contraseña no se envía a ningún servidor.</p>
</form>
</main>

<script>
(function () {
  'use strict';
  var P = JSON.parse(document.getElementById('payload').textContent);
  var $ = function (id) { return document.getElementById(id); };
  var fails = 0, busy = false;
  var unb64 = function (s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
  var salt = unb64(P.s), iv = unb64(P.i), ct = unb64(P.c), pid = P.s.slice(0, 12);
  function idb() { return new Promise(function (res, rej) { var r = indexedDB.open('rh_gate_v1', 1); r.onupgradeneeded = function () { r.result.createObjectStore('k'); }; r.onsuccess = function () { res(r.result); }; r.onerror = function () { rej(r.error); }; }); }
  function idbGet() { return idb().then(function (db) { return new Promise(function (res, rej) { var q = db.transaction('k').objectStore('k').get('key'); q.onsuccess = function () { res(q.result); }; q.onerror = function () { rej(q.error); }; }); }); }
  function idbPut(v) { return idb().then(function (db) { return new Promise(function (res, rej) { var t = db.transaction('k', 'readwrite'); t.objectStore('k').put(v, 'key'); t.oncomplete = res; t.onerror = function () { rej(t.error); }; }); }); }
  function idbDel() { return idb().then(function (db) { return new Promise(function (res) { var t = db.transaction('k', 'readwrite'); t.objectStore('k').delete('key'); t.oncomplete = res; t.onerror = res; }); }); }
  window.RHGate = { lock: function () { return idbDel().catch(function () {}).then(function () { location.reload(); }); } };
  function decrypt(key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct).then(function (b) { return new TextDecoder().decode(b); }); }
  function launch(html) { document.open(); document.write(html); document.close(); }
  function derive(pw) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: P.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    });
  }
  function say(t) { $('msg').textContent = t; }
  if (!(window.crypto && crypto.subtle)) { say('Este navegador o esta dirección no permite el descifrado. Abre la página con https:// en Safari o Chrome.'); $('go').disabled = true; return; }
  idbGet().then(function (o) { if (o && o.pid === pid && o.key) return decrypt(o.key).then(launch).catch(function () { return idbDel(); }); }).catch(function () {});
  $('f').addEventListener('submit', function (ev) {
    ev.preventDefault(); if (busy) return;
    var pw = $('pw').value; if (!pw) { say('Escribe la contraseña.'); return; }
    busy = true; $('go').disabled = true; say('Verificando…');
    derive(pw).then(function (key) {
      return decrypt(key).then(function (html) {
        var keep = $('rem').checked ? idbPut({ pid: pid, key: key }).catch(function () {}) : Promise.resolve();
        return keep.then(function () { launch(html); });
      });
    }).catch(function () {
      fails++; var wait = Math.min(fails, 5) * 1000;
      say('Contraseña incorrecta.' + (fails > 2 ? ' Espera un momento antes de reintentar.' : ''));
      $('pw').value = ''; setTimeout(function () { busy = false; $('go').disabled = false; $('pw').focus(); }, wait);
    });
  });
})();
</script>
